spring.application.name=agentic-sdlc-orchestrator
server.port=8080

# Working folder the agents build in, and where run evidence is written.
# Relative paths are resolved against the repository root.
agentic.workspace-dir=workspaces/demo
agentic.export-dir=data/runs

# Set ANTHROPIC_API_KEY to let the Developer and Test agents write code with a language model.
# Without a key they replay the verified implementation, so everything also runs offline.
agentic.llm.api-key=${ANTHROPIC_API_KEY:}
agentic.llm.model=${ANTHROPIC_MODEL:claude-sonnet-5-5}

# Use "mvn -o" for build/test gates once the dependencies are cached (faster demos).
agentic.maven-offline=false
agentic.maven-timeout-minutes=10
# Full path to mvn / mvn.cmd when Maven is not on the PATH (e.g. the copy bundled with IntelliJ).
agentic.maven-command=${MAVEN_COMMAND:}

spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health,info,metrics
